[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencompute"
version = "0.1.0"
description = "An experimental open-source runtime for composing AI capabilities into self-hosted workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.30",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
opencompute = "opencompute.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["opencompute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
